<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SYNC — Internship Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    /* =========================================================
       ROOT
    ========================================================= */

    :root {
      --bg: #070a10;
      --bg-soft: #0b0f17;
      --panel: #10151f;
      --panel-2: #141a25;
      --panel-3: #18202d;

      --border: #252d3b;
      --border-soft: #1c2430;

      --text: #f5f7fb;
      --text-soft: #c6cedb;
      --muted: #8792a5;

      --primary: #695cff;
      --primary-light: #8177ff;

      --blue: #3182ff;
      --green: #27d477;
      --yellow: #f4c64e;
      --red: #ff6178;
      --purple: #b36cff;

      --radius: 14px;
      --radius-small: 9px;

      --shadow:
        0 18px 50px rgba(0, 0, 0, 0.25);

      --transition: 0.2s ease;
    }

    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 70% -20%,
          rgba(105, 92, 255, 0.13),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);
      font-family: "Inter", sans-serif;
      overflow-x: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       DESKTOP APP
    ========================================================= */

    .app {
      min-height: 100vh;
      display: flex;
    }

    /* =========================================================
       SIDEBAR
    ========================================================= */

    .sidebar {
      width: 240px;
      min-width: 240px;

      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;

      z-index: 100;

      background: #090d14;
      border-right: 1px solid var(--border);

      padding: 24px 16px;

      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 0 10px 30px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;

      border-radius: 12px;

      display: grid;
      place-items: center;

      font-size: 18px;
      font-weight: 800;

      background:
        linear-gradient(
          135deg,
          #776dff,
          #4d45c9
        );

      box-shadow:
        0 8px 25px rgba(105, 92, 255, 0.25);
    }

    .brand-name {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .brand-subtitle {
      margin-top: 2px;

      font-size: 10px;
      color: var(--muted);
    }

    .desktop-nav {
      display: grid;
      gap: 6px;
    }

    .desktop-nav button {
      width: 100%;

      border: none;
      background: transparent;

      color: #aab4c5;

      text-align: left;

      padding: 12px 13px;

      border-radius: 10px;

      display: flex;
      align-items: center;
      gap: 11px;

      transition: var(--transition);
    }

    .desktop-nav button:hover {
      background: #151a25;
      color: white;
    }

    .desktop-nav button.active {
      background: #19152f;
      color: white;

      box-shadow:
        inset 3px 0 var(--primary);
    }

    .side-footer {
      margin-top: auto;

      border-top: 1px solid var(--border);

      padding: 15px 12px;

      color: var(--muted);

      font-size: 11px;
    }

    .side-footer strong {
      display: block;
      color: white;
      margin-bottom: 4px;
    }

    /* =========================================================
       MAIN
    ========================================================= */

    main {
      width: calc(100% - 240px);

      margin-left: 240px;

      padding: 30px 34px 50px;
    }

    /* =========================================================
       TOP HEADER
    ========================================================= */

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;

      margin-bottom: 25px;
    }

    .page-title h1 {
      font-size: 27px;
      font-weight: 800;
    }

    .page-title p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
    }

    .desktop-search-area {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .search-input {
      width: 320px;

      background: var(--panel);

      border: 1px solid var(--border);

      color: white;

      border-radius: 10px;

      padding: 11px 13px;

      outline: none;

      transition: var(--transition);
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(105, 92, 255, 0.1);
    }

    /* =========================================================
       BUTTONS
    ========================================================= */

    .btn {
      border: 1px solid var(--border);

      background: var(--panel);

      color: white;

      border-radius: 9px;

      padding: 10px 13px;

      transition: var(--transition);
    }

    .btn:hover {
      filter: brightness(1.12);
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
    }

    .btn-blue {
      background: var(--blue);
      border-color: var(--blue);
    }

    /* =========================================================
       STATS
    ========================================================= */

    .stats-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 14px;
    }

    .stat-card {
      min-height: 125px;

      padding: 18px;

      border-radius: var(--radius);

      background:
        linear-gradient(
          180deg,
          #111722,
          #0e131c
        );

      border: 1px solid var(--border);

      box-shadow: var(--shadow);
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
    }

    .stat-number {
      margin-top: 9px;

      font-size: 28px;
      font-weight: 800;
    }

    .stat-description {
      margin-top: 5px;

      color: #68758a;
      font-size: 11px;
    }

    /* =========================================================
       TODAY'S FOCUS
    ========================================================= */

    .focus-section {
      margin-top: 22px;

      padding: 20px;

      border-radius: var(--radius);

      border: 1px solid #302b5d;

      background:
        linear-gradient(
          100deg,
          rgba(105, 92, 255, 0.16),
          rgba(16, 21, 31, 0.95)
        );
    }

    .focus-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 15px;
    }

    .focus-header h2 {
      font-size: 16px;
    }

    .focus-header p {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .focus-items {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 10px;
    }

    .focus-item {
      padding: 13px;

      background: rgba(10, 14, 22, 0.65);

      border: 1px solid var(--border);

      border-radius: 10px;
    }

    .focus-item-company {
      font-size: 11px;
      color: var(--muted);
    }

    .focus-item-name {
      margin-top: 5px;

      font-size: 12px;
      font-weight: 700;
    }

    .focus-item-meta {
      margin-top: 8px;

      color: var(--muted);

      font-size: 10px;
    }

    /* =========================================================
       SECTION
    ========================================================= */

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 15px;

      margin: 25px 0 12px;
    }

    .section-header h2 {
      font-size: 16px;
    }

    /* =========================================================
       FILTERS
    ========================================================= */

    .filters {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-select {
      background: var(--panel);

      color: var(--text-soft);

      border: 1px solid var(--border);

      border-radius: 9px;

      padding: 9px 10px;

      outline: none;

      min-width: 130px;
    }

    /* =========================================================
       DESKTOP TABLE
    ========================================================= */

    .table-wrapper {
      width: 100%;

      overflow-x: auto;

      border-radius: var(--radius);

      border: 1px solid var(--border);

      background: var(--panel);
    }

    .opportunity-table {
      width: 100%;

      min-width: 900px;

      border-collapse: collapse;
    }

    .opportunity-table th {
      padding: 14px;

      text-align: left;

      color: #778397;

      font-size: 10px;

      border-bottom: 1px solid var(--border);
    }

    .opportunity-table td {
      padding: 14px;

      font-size: 12px;

      border-bottom: 1px solid #1c2430;
    }

    .opportunity-table tr:last-child td {
      border-bottom: none;
    }

    .company-name {
      font-weight: 700;
    }

    .opportunity-name {
      color: #aeb8c8;

      font-size: 11px;

      margin-top: 4px;
    }

    /* =========================================================
       BADGES
    ========================================================= */

    .badge {
      display: inline-flex;

      align-items: center;

      padding: 5px 8px;

      border-radius: 20px;

      background: #1b2130;

      color: #c7cfdd;

      font-size: 10px;

      white-space: nowrap;
    }

    .badge-green {
      background: rgba(39, 212, 119, 0.1);
      color: var(--green);
    }

    .badge-yellow {
      background: rgba(244, 198, 78, 0.1);
      color: var(--yellow);
    }

    .badge-purple {
      background: rgba(179, 108, 255, 0.1);
      color: var(--purple);
    }

    /* =========================================================
       BOOKMARK
    ========================================================= */

    .bookmark-button {
      border: none;

      background: transparent;

      color: #5e6a7d;

      font-size: 18px;

      transition: var(--transition);
    }

    .bookmark-button.active {
      color: var(--yellow);
    }

    .bookmark-button:hover {
      transform: scale(1.12);
    }

    /* =========================================================
       MOBILE OPPORTUNITY CARDS
    ========================================================= */

    .mobile-opportunities {
      display: none;
    }

    .mobile-opportunity-card {
      background:
        linear-gradient(
          180deg,
          #111823,
          #0d131c
        );

      border: 1px solid var(--border);

      border-radius: 15px;

      padding: 15px;

      margin-bottom: 11px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.18);
    }

    .mobile-card-top {
      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 10px;
    }

    .mobile-company-row {
      display: flex;

      align-items: center;

      gap: 10px;
    }

    .company-logo-placeholder {
      width: 38px;
      height: 38px;

      border-radius: 10px;

      display: grid;
      place-items: center;

      background: #1c2430;

      font-size: 15px;
      font-weight: 800;
    }

    .mobile-company {
      font-size: 11px;
      color: var(--muted);
    }

    .mobile-opportunity-name {
      margin-top: 3px;

      font-size: 14px;
      font-weight: 700;

      line-height: 1.35;
    }

    .mobile-category {
      margin-top: 10px;
    }

    .mobile-meta {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 10px;

      color: var(--muted);

      font-size: 10px;
    }

    .mobile-card-button {
      width: 100%;

      margin-top: 13px;

      border: none;

      background:
        linear-gradient(
          90deg,
          #6257ed,
          #756bff
        );

      color: white;

      border-radius: 8px;

      padding: 10px;

      font-size: 11px;
      font-weight: 600;
    }

    /* =========================================================
       EMPTY
    ========================================================= */

    .empty-state {
      padding: 45px 20px;

      text-align: center;

      color: var(--muted);
    }

    /* =========================================================
       MODAL
    ========================================================= */

    .modal-overlay {
      position: fixed;

      inset: 0;

      z-index: 500;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0, 0, 0, 0.75);

      backdrop-filter: blur(7px);
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: min(560px, 100%);

      max-height: 90vh;

      overflow-y: auto;

      padding: 24px;

      border-radius: 17px;

      border: 1px solid var(--border);

      background: #10151f;

      box-shadow: var(--shadow);
    }

    .modal-close {
      float: right;

      border: none;

      background: transparent;

      color: var(--muted);

      font-size: 24px;
    }

    .modal h2 {
      margin-top: 12px;

      font-size: 21px;
    }

    .modal-company {
      color: var(--muted);

      margin-top: 5px;

      font-size: 13px;
    }

    .modal-meta {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin: 20px 0;
    }

    .modal-meta-item {
      padding: 12px;

      border-radius: 9px;

      background: var(--panel-2);

      border: 1px solid var(--border);
    }

    .modal-meta-item small {
      display: block;

      color: var(--muted);

      font-size: 10px;
    }

    .modal-meta-item strong {
      display: block;

      margin-top: 5px;

      font-size: 12px;
    }

    .modal-status-label {
      color: var(--muted);

      font-size: 10px;
    }

    .modal-status {
      width: 100%;

      margin-top: 7px;

      padding: 11px;

      background: var(--panel-2);

      color: white;

      border: 1px solid var(--border);

      border-radius: 9px;

      outline: none;
    }

    .modal-actions {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 18px;
    }

    /* =========================================================
       MOBILE HEADER
    ========================================================= */

    .mobile-header {
      display: none;
    }

    /* =========================================================
       MOBILE MENU
    ========================================================= */

    .mobile-menu-overlay {
      position: fixed;

      inset: 0;

      z-index: 300;

      display: none;

      background: rgba(0, 0, 0, 0.72);
    }

    .mobile-menu-overlay.show {
      display: block;
    }

    .mobile-menu {
      width: 82%;

      max-width: 320px;

      height: 100%;

      padding: 25px 18px;

      background: #0b1018;

      border-right: 1px solid var(--border);
    }

    .mobile-menu-brand {
      display: flex;

      align-items: center;

      gap: 12px;

      padding-bottom: 28px;
    }

    .mobile-menu-nav {
      display: grid;

      gap: 5px;
    }

    .mobile-menu-nav button {
      border: none;

      background: transparent;

      color: #bac3d1;

      text-align: left;

      padding: 13px;

      border-radius: 9px;
    }

    .mobile-menu-nav button.active,
    .mobile-menu-nav button:hover {
      background: #171d29;

      color: white;
    }

    /* =========================================================
       MOBILE FILTER DRAWER
    ========================================================= */

    .filter-drawer-overlay {
      position: fixed;

      inset: 0;

      z-index: 400;

      display: none;

      align-items: flex-end;

      background: rgba(0, 0, 0, 0.72);
    }

    .filter-drawer-overlay.show {
      display: flex;
    }

    .filter-drawer {
      width: 100%;

      background: #0e141e;

      border-radius: 20px 20px 0 0;

      border: 1px solid var(--border);

      padding: 20px;

      box-shadow: 0 -15px 45px rgba(0, 0, 0, 0.35);
    }

    .filter-drawer-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 20px;
    }

    .filter-drawer-header h2 {
      font-size: 17px;
    }

    .drawer-close {
      border: none;

      background: transparent;

      color: var(--muted);

      font-size: 22px;
    }

    .drawer-field {
      margin-bottom: 13px;
    }

    .drawer-field label {
      display: block;

      color: var(--text-soft);

      font-size: 11px;

      margin-bottom: 7px;
    }

    .drawer-field select {
      width: 100%;

      background: var(--panel-2);

      color: white;

      border: 1px solid var(--border);

      padding: 12px;

      border-radius: 9px;

      outline: none;
    }

    .drawer-actions {
      display: grid;

      gap: 9px;

      margin-top: 18px;
    }

    /* =========================================================
       MOBILE BOTTOM NAV
    ========================================================= */

    .mobile-bottom-nav {
      display: none;
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 1050px) {
      .stats-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .top-header {
        align-items: flex-start;

        flex-direction: column;
      }

      .desktop-search-area {
        width: 100%;
      }

      .search-input {
        width: 100%;
      }

      .focus-items {
        grid-template-columns: 1fr;
      }
    }

    /* =========================================================
       TABLET
    ========================================================= */

    @media (max-width: 760px) {

      .sidebar {
        display: none;
      }

      main {
        width: 100%;

        margin-left: 0;

        padding:
          78px
          15px
          90px;
      }

      .desktop-search-area {
        display: none;
      }

      .mobile-header {
        position: fixed;

        top: 0;
        left: 0;
        right: 0;

        height: 64px;

        z-index: 150;

        display: flex;

        align-items: center;

        justify-content: space-between;

        padding: 0 15px;

        background:
          rgba(8, 12, 18, 0.94);

        backdrop-filter: blur(14px);

        border-bottom: 1px solid var(--border);
      }

      .mobile-header-left {
        display: flex;

        align-items: center;

        gap: 10px;
      }

      .mobile-menu-button {
        width: 35px;
        height: 35px;

        border: none;

        background: transparent;

        color: white;

        font-size: 22px;
      }

      .mobile-logo {
        font-size: 20px;
        font-weight: 800;
        color: #6f65ff;
      }

      .mobile-subtitle {
        color: var(--muted);

        font-size: 8px;

        margin-top: 1px;
      }

      .mobile-header-right {
        display: flex;

        align-items: center;

        gap: 13px;
      }

      .mobile-icon {
        border: none;

        background: transparent;

        color: white;

        font-size: 17px;
      }

      .mobile-avatar {
        width: 29px;
        height: 29px;

        border-radius: 50%;

        display: grid;
        place-items: center;

        background:
          linear-gradient(
            135deg,
            #756bff,
            #3c36a8
          );

        font-size: 10px;
        font-weight: 700;
      }

      .page-title h1 {
        font-size: 22px;
      }

      .page-title p {
        font-size: 11px;
      }

      /* MOBILE STATS */

      .stats-grid {
        grid-template-columns: 1fr 1fr;

        gap: 10px;
      }

      .stat-card {
        min-height: 104px;

        padding: 14px;
      }

      .stat-number {
        font-size: 23px;
      }

      .stat-description {
        font-size: 9px;
      }

      /* MOBILE FOCUS */

      .focus-section {
        padding: 15px;
      }

      .focus-header h2 {
        font-size: 15px;
      }

      .focus-items {
        gap: 8px;
      }

      .focus-item {
        padding: 12px;
      }

      /* MOBILE TABLE OFF */

      .table-wrapper {
        display: none;
      }

      .mobile-opportunities {
        display: block;
      }

      /* MOBILE SECTION */

      .section-header {
        align-items: flex-start;

        flex-direction: column;

        margin-top: 22px;
      }

      .filters {
        width: 100%;
      }

      .desktop-filter {
        display: none;
      }

      .mobile-filter-button {
        display: flex;

        width: 100%;

        align-items: center;

        justify-content: space-between;

        background: var(--panel);

        color: white;

        border: 1px solid var(--border);

        padding: 11px;

        border-radius: 9px;
      }

      /* MOBILE BOTTOM NAV */

      .mobile-bottom-nav {
        position: fixed;

        left: 0;
        right: 0;
        bottom: 0;

        height: 67px;

        z-index: 180;

        display: grid;

        grid-template-columns:
          repeat(5, 1fr);

        background:
          rgba(9, 13, 20, 0.96);

        backdrop-filter: blur(14px);

        border-top: 1px solid var(--border);
      }

      .mobile-bottom-nav button {
        border: none;

        background: transparent;

        color: #778398;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        gap: 4px;

        font-size: 9px;
      }

      .mobile-bottom-nav button span {
        font-size: 17px;
      }

      .mobile-bottom-nav button.active {
        color: #43a5ff;
      }

      /* MOBILE MODAL */

      .modal-overlay {
        align-items: flex-end;

        padding: 0;
      }

      .modal {
        width: 100%;

        max-height: 88vh;

        border-radius:
          20px
          20px
          0
          0;

        padding: 20px;
      }

      .modal-meta {
        grid-template-columns: 1fr 1fr;
      }

      .modal-actions {
        display: grid;

        grid-template-columns: 1fr;
      }

      .modal-actions .btn,
      .modal-actions a {
        width: 100%;

        text-align: center;
      }
    }

    /* =========================================================
       VERY SMALL MOBILE
    ========================================================= */

    @media (max-width: 390px) {

      main {
        padding-left: 12px;
        padding-right: 12px;
      }

      .mobile-opportunity-card {
        padding: 13px;
      }

      .mobile-opportunity-name {
        font-size: 13px;
      }

      .stat-card {
        padding: 12px;
      }

      .stat-number {
        font-size: 21px;
      }

      .focus-section {
        padding: 13px;
      }
    }

    /* =========================================================
       DESKTOP MOBILE-ONLY ELEMENTS
    ========================================================= */

  <!-- =========================================================

  <script>

    /* =========================================================
       GLOBAL STATE
    ========================================================= */

    let opportunities = [];

    let currentView = "dashboard";

    let searchTerm = "";

    let filters = {
      category: "",
      month: "",
      quarter: "",
      status: ""
    };


    const STORAGE_KEY =
      "sync_internship_tracker_v1";


    let state =
      JSON.parse(
        localStorage.getItem(STORAGE_KEY)
      ) || {
        bookmarks: [],
        statuses: {}
      };


    /* =========================================================
       HELPERS
    ========================================================= */

    const $ = (selector) =>
      document.querySelector(selector);


    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function saveState() {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
      );

    }


    function isBookmarked(id) {

      return state.bookmarks.includes(id);

    }


    function getPersonalStatus(id) {

      return (
        state.statuses[id] ||
        "Not Applied"
      );

    }


    function getInitial(company) {

      return company
        ? company.charAt(0).toUpperCase()
        : "?";

    }


    /* =========================================================
       FILTER DATA
    ========================================================= */

    function getFilteredOpportunities() {

      let result =
        opportunities.filter((item) => {

          const query =
            searchTerm.toLowerCase();

          const matchesSearch =
            !query ||
            item.company
              .toLowerCase()
              .includes(query) ||
            item.name
              .toLowerCase()
              .includes(query);


          const matchesCategory =
            !filters.category ||
            item.category === filters.category;


          const matchesMonth =
            !filters.month ||
            item.tentativeMonth === filters.month;


          const matchesQuarter =
            !filters.quarter ||
            item.quarter === filters.quarter;


          const matchesStatus =
            !filters.status ||
            getPersonalStatus(item.id) ===
              filters.status;


          return (
            matchesSearch &&
            matchesCategory &&
            matchesMonth &&
            matchesQuarter &&
            matchesStatus
          );

        });


      if (currentView === "bookmarked") {

        result =
          result.filter(
            item =>
              isBookmarked(item.id)
          );

      }


      if (currentView === "applied") {

        result =
          result.filter(
            item =>
              getPersonalStatus(item.id) !==
              "Not Applied"
          );

      }


      if (currentView === "upcoming") {

        result =
          result.filter(
            item =>
              item.tentativeMonth !==
              "Year Round"
          );

      }


      return result;

    }


    /* =========================================================
       PAGE TITLES
    ========================================================= */

    function updatePageInformation() {

      const pages = {

        dashboard: [
          "Internship Dashboard",
          "Your daily command center for opportunity hunting."
        ],

        all: [
          "All Opportunities",
          "Browse and filter every tracked opportunity."
        ],

        upcoming: [
          "Upcoming Opportunities",
          "Plan your internship hunting around tentative periods."
        ],

        bookmarked: [
          "Bookmarked",
          "Your saved opportunities for focused review."
        ],

        applied: [
          "My Applications",
          "Track your personal application pipeline."
        ],

        calendar: [
          "Calendar",
          "Opportunity timing based on the source data."
        ],

        settings: [
          "Settings",
          "Manage your local SYNC tracking data."
        ]

      };


      const info =
        pages[currentView];


      $("#pageTitle").textContent =
        info[0];

      $("#pageSubtitle").textContent =
        info[1];

    }


    /* =========================================================
       STATS
    ========================================================= */

    function renderStats() {

      const total =
        opportunities.length;


      const upcoming =
        opportunities.filter(
          item =>
            item.tentativeMonth !==
            "Year Round"
        ).length;


      const applied =
        opportunities.filter(
          item =>
            getPersonalStatus(item.id) !==
            "Not Applied"
        ).length;


      const bookmarked =
        opportunities.filter(
          item =>
            isBookmarked(item.id)
        ).length;


      const cards = [

        {
          label: "Total Opportunities",
          number: total,
          description: "Tracked opportunities"
        },

        {
          label: "Upcoming",
          number: upcoming,
          description: "Month-based opportunities"
        },

        {
          label: "Applied",
          number: applied,
          description: "Your application tracking"
        },

        {
          label: "Bookmarked",
          number: bookmarked,
          description: "Saved for later"
        }

      ];


      $("#statsContainer").innerHTML =
        cards.map(card => `

          <div class="stat-card">

            <div class="stat-label">
              ${card.label}
            </div>

            <div class="stat-number">
              ${card.number}
            </div>

            <div class="stat-description">
              ${card.description}
            </div>

          </div>

        `).join("");

    }


    /* =========================================================
       TODAY'S FOCUS
    ========================================================= */

    function renderFocus() {

      const focus =
        opportunities
          .filter(
            item =>
              item.tentativeMonth !==
              "Year Round"
          )
          .slice(0, 3);


      $("#focusDescription").textContent =
        `${focus.length} opportunities to keep on your radar.`;


      $("#focusItems").innerHTML =
        focus.map(item => `

          <div
            class="focus-item"
            data-focus-id="${item.id}"
          >

            <div class="focus-item-company">
              ${escapeHTML(item.company)}
            </div>

            <div class="focus-item-name">
              ${escapeHTML(item.name)}
            </div>

            <div class="focus-item-meta">
              ${escapeHTML(item.tentativeMonth)}
              •
              ${escapeHTML(item.quarter)}
            </div>

          </div>

        `).join("");

    }


    /* =========================================================
       FILTER OPTIONS
    ========================================================= */

    function uniqueValues(field) {

      return [
        ...new Set(
          opportunities.map(
            item => item[field]
          )
        )
      ].sort();

    }


    function createOptionHTML(
      values,
      placeholder
    ) {

      return `

        <option value="">
          ${placeholder}
        </option>

        ${values.map(
          value => `

            <option value="${escapeHTML(value)}">
              ${escapeHTML(value)}
            </option>

          `
        ).join("")}

      `;

    }


    function renderDesktopFilters() {

      const categories =
        uniqueValues("category");

      const months =
        uniqueValues("tentativeMonth");

      const quarters =
        uniqueValues("quarter");


      $("#desktopFilters").innerHTML = `

        <select
          class="filter-select"
          id="desktopCategory"
        >

          ${createOptionHTML(
            categories,
            "All Categories"
          )}

        </select>


        <select
          class="filter-select"
          id="desktopMonth"
        >

          ${createOptionHTML(
            months,
            "All Months"
          )}

        </select>


        <select
          class="filter-select"
          id="desktopQuarter"
        >

          ${createOptionHTML(
            quarters,
            "All Quarters"
          )}

        </select>


        <select
          class="filter-select"
          id="desktopStatus"
        >

          <option value="">
            All Status
          </option>

          <option>
            Not Applied
          </option>

          <option>
            Interested
          </option>

          <option>
            Applied
          </option>

          <option>
            Interview
          </option>

          <option>
            Selected
          </option>

          <option>
            Rejected
          </option>

        </select>

      `;


      $("#desktopCategory").value =
        filters.category;

      $("#desktopMonth").value =
        filters.month;

      $("#desktopQuarter").value =
        filters.quarter;

      $("#desktopStatus").value =
        filters.status;


      $("#desktopCategory").onchange =
        event => {

          filters.category =
            event.target.value;

          render();

        };


      $("#desktopMonth").onchange =
        event => {

          filters.month =
            event.target.value;

          render();

        };


      $("#desktopQuarter").onchange =
        event => {

          filters.quarter =
            event.target.value;

          render();

        };


      $("#desktopStatus").onchange =
        event => {

          filters.status =
            event.target.value;

          render();

        };

    }


    /* =========================================================
       MOBILE FILTER OPTIONS
    ========================================================= */

    function renderMobileFilters() {

      const categories =
        uniqueValues("category");

      const months =
        uniqueValues("tentativeMonth");

      const quarters =
        uniqueValues("quarter");


      $("#mobileCategory").innerHTML =
        createOptionHTML(
          categories,
          "All Categories"
        );


      $("#mobileMonth").innerHTML =
        createOptionHTML(
          months,
          "All Months"
        );


      $("#mobileQuarter").innerHTML =
        createOptionHTML(
          quarters,
          "All Quarters"
        );


      $("#mobileCategory").value =
        filters.category;

      $("#mobileMonth").value =
        filters.month;

      $("#mobileQuarter").value =
        filters.quarter;

      $("#mobileStatus").value =
        filters.status;

    }


    /* =========================================================
       CATEGORY BADGE
    ========================================================= */

    function categoryBadge(category) {

      let className = "";

      if (category === "Internship") {
        className = "badge-green";
      }

      if (category === "Hackathon") {
        className = "badge-purple";
      }

      if (category === "Research") {
        className = "badge-yellow";
      }


      return `
        <span class="badge ${className}">
          ${escapeHTML(category)}
        </span>
      `;

    }


    /* =========================================================
       DESKTOP TABLE
    ========================================================= */

    function renderDesktopTable(items) {

      if (!items.length) {

        $("#desktopTable").innerHTML = `

          <div class="empty-state">
            No opportunities match the current filters.
          </div>

        `;

        return;

      }


      $("#desktopTable").innerHTML = `

        <table class="opportunity-table">

          <thead>

            <tr>

              <th>
                COMPANY / OPPORTUNITY
              </th>

              <th>
                CATEGORY
              </th>

              <th>
                TENTATIVE
              </th>

              <th>
                QUARTER
              </th>

              <th>
                MY STATUS
              </th>

              <th>
                ★
              </th>

              <th>
                ACTION
              </th>

            </tr>

          </thead>


          <tbody>

            ${items.map(item => `

              <tr>

                <td>

                  <div class="company-name">
                    ${escapeHTML(item.company)}
                  </div>

                  <div class="opportunity-name">
                    ${escapeHTML(item.name)}
                  </div>

                </td>


                <td>
                  ${categoryBadge(item.category)}
                </td>


                <td>
                  ${escapeHTML(item.tentativeMonth)}
                </td>


                <td>
                  ${escapeHTML(item.quarter)}
                </td>


                <td>

                  <span
                    class="badge ${
                      getPersonalStatus(item.id) ===
                      "Applied"
                        ? "badge-green"
                        : ""
                    }"
                  >
                    ${getPersonalStatus(item.id)}
                  </span>

                </td>


                <td>

                  <button
                    class="
                      bookmark-button
                      ${
                        isBookmarked(item.id)
                          ? "active"
                          : ""
                      }
                    "
                    data-bookmark="${item.id}"
                  >
                    ★
                  </button>

                </td>


                <td>

                  <button
                    class="btn"
                    data-open="${item.id}"
                  >
                    View Details
                  </button>

                </td>

              </tr>

            `).join("")}

          </tbody>

        </table>

      `;

    }


    /* =========================================================
       MOBILE CARDS
    ========================================================= */

    function renderMobileCards(items) {

      if (!items.length) {

        $("#mobileCards").innerHTML = `

          <div class="empty-state">
            No opportunities found.
          </div>

        `;

        return;

      }


      $("#mobileCards").innerHTML =
        items.map(item => `

          <article
            class="mobile-opportunity-card"
          >

            <div class="mobile-card-top">

              <div class="mobile-company-row">

                <div class="company-logo-placeholder">

                  ${getInitial(item.company)}

                </div>


                <div>

                  <div class="mobile-company">
                    ${escapeHTML(item.company)}
                  </div>

                  <div class="mobile-opportunity-name">
                    ${escapeHTML(item.name)}
                  </div>

                </div>

              </div>


              <button
                class="
                  bookmark-button
                  ${
                    isBookmarked(item.id)
                      ? "active"
                      : ""
                  }
                "
                data-bookmark="${item.id}"
              >
                ${
                  isBookmarked(item.id)
                    ? "★"
                    : "☆"
                }
              </button>

            </div>


            <div class="mobile-category">

              ${categoryBadge(
                item.category
              )}

            </div>


            <div class="mobile-meta">

              <span>
                ◷ ${escapeHTML(
                  item.tentativeMonth
                )}
              </span>

              <span>
                •
              </span>

              <span>
                ${escapeHTML(
                  item.quarter
                )}
              </span>

            </div>


            <button
              class="mobile-card-button"
              data-open="${item.id}"
            >
              View Details →
            </button>

          </article>

        `).join("");

    }


    /* =========================================================
       MODAL
    ========================================================= */

    function openModal(id) {

      const item =
        opportunities.find(
          opportunity =>
            opportunity.id === id
        );


      if (!item) {
        return;
      }


      $("#modalContent").innerHTML = `

        ${categoryBadge(item.category)}


        <h2>
          ${escapeHTML(item.name)}
        </h2>


        <div class="modal-company">
          ${escapeHTML(item.company)}
        </div>


        <div class="modal-meta">

          <div class="modal-meta-item">

            <small>
              Tentative Month
            </small>

            <strong>
              ${escapeHTML(
                item.tentativeMonth
              )}
            </strong>

          </div>


          <div class="modal-meta-item">

            <small>
              Quarter
            </small>

            <strong>
              ${escapeHTML(
                item.quarter
              )}
            </strong>

          </div>


          <div class="modal-meta-item">

            <small>
              Personal Status
            </small>

            <strong>
              ${getPersonalStatus(item.id)}
            </strong>

          </div>


          <div class="modal-meta-item">

            <small>
              Opportunity Link
            </small>

            <strong>
              ${
                item.sourceLink
                  ? "Available"
                  : "Not Available"
              }
            </strong>

          </div>

        </div>


        <label class="modal-status-label">
          PERSONAL STATUS
        </label>


        <select
          class="modal-status"
          id="modalStatus"
        >

          ${[
            "Not Applied",
            "Interested",
            "Applied",
            "Interview",
            "Selected",
            "Rejected"
          ].map(status => `

            <option
              ${
                getPersonalStatus(item.id) ===
                status
                  ? "selected"
                  : ""
              }
            >
              ${status}
            </option>

          `).join("")}

        </select>


        <div class="modal-actions">

          <button
            class="btn"
            id="modalBookmark"
          >
            ${
              isBookmarked(item.id)
                ? "Remove Bookmark"
                : "Bookmark"
            }
          </button>


          ${
            item.sourceLink
              ? `
                <a
                  class="btn btn-primary"
                  href="${escapeHTML(
                    item.sourceLink
                  )}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Visit Opportunity ↗
                </a>
              `
              : `
                <button
                  class="btn"
                  disabled
                >
                  Link Not Available
                </button>
              `
          }


          ${
            (item.additionalLinks || [])
              .map(
                (link, index) => `

                  <a
                    class="btn"
                    href="${escapeHTML(link)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    Additional Link ${
                      index + 1
                    } ↗
                  </a>

                `
              )
              .join("")
          }

        </div>

      `;


      $("#modalOverlay")
        .classList.add("show");


      $("#modalStatus").onchange =
        event => {

          state.statuses[item.id] =
            event.target.value;

          saveState();

          render();

          openModal(item.id);

        };


      $("#modalBookmark").onclick =
        () => {

          toggleBookmark(item.id);

          render();

          openModal(item.id);

        };

    }


    function closeModal() {

      $("#modalOverlay")
        .classList.remove("show");

    }


    /* =========================================================
       BOOKMARK
    ========================================================= */

    function toggleBookmark(id) {

      if (isBookmarked(id)) {

        state.bookmarks =
          state.bookmarks.filter(
            bookmarkId =>
              bookmarkId !== id
          );

      } else {

        state.bookmarks.push(id);

      }


      saveState();

    }


    /* =========================================================
       RENDER
    ========================================================= */

    function render() {

      updatePageInformation();

      renderStats();

      renderFocus();

      renderDesktopFilters();

      renderMobileFilters();


      const items =
        getFilteredOpportunities();


      renderDesktopTable(items);

      renderMobileCards(items);


      bindDynamicButtons();

    }


    /* =========================================================
       DYNAMIC BUTTON EVENTS
    ========================================================= */

    function bindDynamicButtons() {

      document
        .querySelectorAll(
          "[data-bookmark]"
        )
        .forEach(button => {

          button.onclick = () => {

            const id =
              Number(
                button.dataset.bookmark
              );

            toggleBookmark(id);

            render();

          };

        });


      document
        .querySelectorAll(
          "[data-open]"
        )
        .forEach(button => {

          button.onclick = () => {

            const id =
              Number(
                button.dataset.open
              );

            openModal(id);

          };

        });


      document
        .querySelectorAll(
          "[data-focus-id]"
        )
        .forEach(element => {

          element.onclick = () => {

            const id =
              Number(
                element.dataset.focusId
              );

            openModal(id);

          };

        });

    }


    /* =========================================================
       NAVIGATION
    ========================================================= */

    function changeView(view) {

      currentView = view;

      document
        .querySelectorAll(
          "[data-view]"
        )
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.view === view
          );

        });


      closeMobileMenu();

      render();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    document
      .querySelectorAll(
        "[data-view]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            changeView(
              button.dataset.view
            );

          }
        );

      });


    /* =========================================================
       SEARCH
    ========================================================= */

    function handleSearch(value) {

      searchTerm =
        value.trim();

      const desktopSearch =
        $("#searchInput");

      const mobileSearch =
        $("#mobileSearchInput");


      if (
        document.activeElement !==
        desktopSearch
      ) {
        desktopSearch.value =
          searchTerm;
      }


      if (
        document.activeElement !==
        mobileSearch
      ) {
        mobileSearch.value =
          searchTerm;
      }


      render();

    }


    $("#searchInput")
      .addEventListener(
        "input",
        event => {

          handleSearch(
            event.target.value
          );

        }
      );


    $("#mobileSearchInput")
      .addEventListener(
        "input",
        event => {

          handleSearch(
            event.target.value
          );

        }
      );


    /* =========================================================
       RESET
    ========================================================= */

    $("#resetButton")
      .addEventListener(
        "click",
        () => {

          searchTerm = "";

          filters = {
            category: "",
            month: "",
            quarter: "",
            status: ""
          };


          $("#searchInput").value =
            "";

          $("#mobileSearchInput").value =
            "";


          render();

        }
      );


    /* =========================================================
       MOBILE MENU
    ========================================================= */

    function openMobileMenu() {

      $("#mobileMenuOverlay")
        .classList.add("show");

    }


    function closeMobileMenu() {

      $("#mobileMenuOverlay")
        .classList.remove("show");

    }


    $("#openMobileMenu")
      .addEventListener(
        "click",
        openMobileMenu
      );


    $("#mobileMenuOverlay")
      .addEventListener(
        "click",
        event => {

          if (
            event.target ===
            $("#mobileMenuOverlay")
          ) {

            closeMobileMenu();

          }

        }
      );


    /* =========================================================
       MOBILE FILTER DRAWER
    ========================================================= */

    $("#openFilterDrawer")
      .addEventListener(
        "click",
        () => {

          renderMobileFilters();

          $("#filterDrawerOverlay")
            .classList.add("show");

        }
      );


    $("#closeFilterDrawer")
      .addEventListener(
        "click",
        () => {

          $("#filterDrawerOverlay")
            .classList.remove("show");

        }
      );


    $("#filterDrawerOverlay")
      .addEventListener(
        "click",
        event => {

          if (
            event.target ===
            $("#filterDrawerOverlay")
          ) {

            $("#filterDrawerOverlay")
              .classList.remove("show");

          }

        }
      );


    /* =========================================================
       APPLY MOBILE FILTERS
    ========================================================= */

    $("#applyMobileFilters")
      .addEventListener(
        "click",
        () => {

          filters.category =
            $("#mobileCategory").value;

          filters.month =
            $("#mobileMonth").value;

          filters.quarter =
            $("#mobileQuarter").value;

          filters.status =
            $("#mobileStatus").value;


          $("#filterDrawerOverlay")
            .classList.remove("show");


          render();

        }
      );


    /* =========================================================
       CLEAR MOBILE FILTERS
    ========================================================= */

    $("#clearMobileFilters")
      .addEventListener(
        "click",
        () => {

          filters = {
            category: "",
            month: "",
            quarter: "",
            status: ""
          };


          renderMobileFilters();

          render();

        }
      );


    /* =========================================================
       MODAL EVENTS
    ========================================================= */

    $("#modalClose")
      .addEventListener(
        "click",
        closeModal
      );


    $("#modalOverlay")
      .addEventListener(
        "click",
        event => {

          if (
            event.target ===
            $("#modalOverlay")
          ) {

            closeModal();

          }

        }
      );


    /* =========================================================
       MORE BUTTON
    ========================================================= */

    $("#bottomMoreButton")
      .addEventListener(
        "click",
        openMobileMenu
      );


    /* =========================================================
       ESC KEY
    ========================================================= */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closeModal();

          closeMobileMenu();

          $("#filterDrawerOverlay")
            .classList.remove("show");

        }

      }
    );


    /* =========================================================
       LOAD DATA
    ========================================================= */

    fetch(
      "data/opportunities.json"
    )
      .then(response => {

        if (!response.ok) {

          throw new Error(
            "Could not load opportunities.json"
          );

        }

        return response.json();

      })
      .then(data => {

        opportunities = data;

        render();

      })
      .catch(error => {

        console.error(error);

        $("#desktopTable").innerHTML = `

          <div class="empty-state">

            Could not load opportunity data.

            <br><br>

            Make sure
            <strong>
              data/opportunities.json
            </strong>
            exists.

          </div>

        `;

        $("#mobileCards").innerHTML = `

          <div class="empty-state">

            Could not load opportunity data.

          </div>

        `;

      });

  </script>

</body>
</html>
